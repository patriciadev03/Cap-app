<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#102c46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CAP">
<meta name="application-name" content="CAP">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CAP — Centre d'Appuis Professionnel</title>
<style>
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:#102c46;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#28384a;-webkit-text-size-adjust:100%;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#lock{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top)) 16px 20px;box-sizing:border-box}
.card{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:26px 22px;box-shadow:0 14px 40px #0006}
.logo{width:58px;height:58px;border-radius:14px;background:#102c46;color:#fff;display:grid;place-items:center;font-weight:800;font-size:19px;border-bottom:4px solid #20b6a4;margin:0 auto 14px}
h1{font-size:21px;color:#102c46;text-align:center;margin:0 0 6px}
.sub{font-size:13.5px;color:#657589;text-align:center;line-height:1.6;margin:0 0 18px}
.step{font-size:12px;font-weight:800;letter-spacing:1px;color:#159b8b;margin:16px 0 6px}
.idbox{display:flex;gap:8px;align-items:stretch}
.idval{flex:1;min-width:0;background:#f4f7fa;border:1px solid #e5ebf1;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;color:#102c46;letter-spacing:.5px;word-break:break-all;-webkit-user-select:text;user-select:text}
button{min-height:46px;border:0;border-radius:10px;font-weight:700;font-size:14px;font-family:inherit;cursor:pointer}
.btn-sec{padding:0 14px;background:#e8f7f4;color:#138b7d}
.btn-main{width:100%;margin-top:10px;background:#20b6a4;color:#fff}
.btn-main:disabled{opacity:.6}
textarea{width:100%;min-height:84px;border:1px solid #cfd8e2;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;box-sizing:border-box;resize:none;-webkit-user-select:text;user-select:text}
.help{font-size:12.5px;color:#78879a;line-height:1.6;margin:6px 0 0}
.msg{margin-top:10px;font-size:13.5px;font-weight:600;min-height:20px;text-align:center}
.msg.err{color:#c0392b}.msg.ok{color:#138b7d}
.lang{display:flex;justify-content:flex-end;gap:6px;margin:-8px 0 8px}
.lang button{min-height:32px;padding:0 12px;border-radius:8px;background:#f4f7fa;color:#657589;font-size:12.5px}
.lang button.on{background:#20b6a4;color:#fff}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;transition:filter .15s}
#wm{position:fixed;inset:0;pointer-events:none;z-index:9999}
@media print{html,body{display:none!important}}
</style>
</head>
<body>

<div id="lock" hidden>
  <div class="card">
    <div class="lang"><button type="button" id="l-fr">Français</button><button type="button" id="l-en">English</button></div>
    <div class="logo">CAP</div>
    <h1 data-i="title">Accès réservé</h1>
    <p class="sub" data-i="sub">Cette application est protégée. Entrez le code d'accès fourni par l'administrateur du CAP.</p>

    <div class="step" data-i="step_code">CODE D'ACCÈS</div>
    <textarea id="code" data-ph="ph" placeholder="Collez ici le code reçu" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>
    <button type="button" class="btn-main" id="go" data-i="go">Activer</button>
    <div class="msg" id="msg" role="status"></div>

    <div class="step" data-i="step_dev">CODE APPAREIL (seulement si l'administrateur le demande)</div>
    <div class="idbox">
      <div class="idval" id="devid">…</div>
      <button type="button" class="btn-sec" id="copy" data-i="copy">Copier</button>
    </div>
  </div>
</div>

<iframe id="app" title="CAP" hidden></iframe>
<div id="wm" hidden></div>

var enc=new TextEncoder(),dec=new TextDecoder();
function b64e(u){var s='';for(var i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s)}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function b64ue(u){return b64e(u).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64ud(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return b64d(s)}
async function derive(secret,salt,iter){
  var base=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:enc.encode(salt),iterations:iter},base,256);
  return new Uint8Array(bits);
}
function aesKey(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function seal(keyRaw,u8){
  var iv=crypto.getRandomValues(new Uint8Array(12));
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},await aesKey(keyRaw),u8));
  var o=new Uint8Array(12+ct.length);o.set(iv);o.set(ct,12);return o;
}
async function unseal(keyRaw,u8){
  return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:u8.slice(0,12)},await aesKey(keyRaw),u8.slice(12)));
}
function normId(s){return String(s).toUpperCase().replace(/[^0-9A-F]/g,'')}
function normPwd(s){return String(s).toLowerCase().replace(/[^a-z0-9]/g,'')}
function masterKey(pwd){return derive(normPwd(pwd),'CAP-master-v1',300000)}
function deviceKey(id){return derive(normId(id),'CAP-device-v1',100000)}
async function makeCode(pwd,id){var K=await masterKey(pwd);var dk=await deviceKey(id);return b64ue(await seal(dk,K))}
async function unlockWith(id,code,payloadB64){
  var dk=await deviceKey(id);
  var K=await unseal(dk,b64ud(String(code).replace(/\s+/g,'')));
  return dec.decode(await unseal(K,b64d(payloadB64)));
}


var LS_ID='cap_dev_id',LS_ACT='cap_act_code';
var API='/.netlify/functions/activate';
var LS_LANG='cap_lang';
var T={
 fr:{title:"Accès réservé",sub:"Cette application est protégée. Entrez le code d'accès fourni par l'administrateur du CAP.",step_code:"CODE D'ACCÈS",ph:"Collez ici le code reçu",go:"Activer",step_dev:"CODE APPAREIL (seulement si l'administrateur le demande)",copy:"Copier",copied:"Copié ✓",
  empty:"Collez d’abord votre code d’accès.",check:"Vérification…",okmsg:"Activation réussie ✓",bad:"Code invalide.",limit:"Nombre maximum d'appareils atteint pour ce code.",net:"Connexion requise pour la première activation. Vérifiez internet puis réessayez."},
 en:{title:"Restricted access",sub:"This application is protected. Enter the access code provided by the CAP administrator.",step_code:"ACCESS CODE",ph:"Paste the code you received here",go:"Activate",step_dev:"DEVICE CODE (only if the administrator asks for it)",copy:"Copy",copied:"Copied ✓",
  empty:"Please paste your access code first.",check:"Checking…",okmsg:"Activation successful ✓",bad:"Invalid code.",limit:"Maximum number of devices reached for this code.",net:"An internet connection is required for the first activation. Check your connection and try again."}
};
var lang='fr',msgKey=null,msgCls='';
try{var sl=localStorage.getItem(LS_LANG);if(sl==='fr'||sl==='en')lang=sl;else if((navigator.language||'').toLowerCase().indexOf('fr')!==0)lang='en'}catch(e){}
function t(k){return T[lang][k]}

var lock=document.getElementById('lock'),app=document.getElementById('app'),wm=document.getElementById('wm');
var elId=document.getElementById('devid'),elCode=document.getElementById('code'),elGo=document.getElementById('go'),elMsg=document.getElementById('msg'),elCopy=document.getElementById('copy');

function newId(){var u=crypto.getRandomValues(new Uint8Array(12)),h='';for(var i=0;i<u.length;i++)h+=('0'+u[i].toString(16)).slice(-2);return h.toUpperCase()}
function getId(){
  var v=null;try{v=localStorage.getItem(LS_ID)}catch(e){}
  if(!v||!/^[0-9A-F]{24}$/.test(v)){v=newId();try{localStorage.setItem(LS_ID,v)}catch(e){}}
  return v;
}
function fmt(id){return id.match(/.{4}/g).join('-')}
function say(tx,c){elMsg.textContent=tx||'';elMsg.className='msg'+(c?' '+c:'')}
function sayK(k,c){msgKey=k;msgCls=c||'';say(t(k),c)}
function applyLang(l){
  lang=l;try{localStorage.setItem(LS_LANG,l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(function(n){n.textContent=T[l][n.getAttribute('data-i')]});
  document.querySelectorAll('[data-ph]').forEach(function(n){n.placeholder=T[l][n.getAttribute('data-ph')]});
  document.getElementById('l-fr').className=l==='fr'?'on':'';document.getElementById('l-en').className=l==='en'?'on':'';
  if(msgKey)say(t(msgKey),msgCls);
}

/* Protections de l'affichage */
function harden(d){
  try{
    if(!d||!d.head||d.__capHard)return;d.__capHard=1;
    var s=d.createElement('style');
    s.textContent='*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}@media print{html{display:none!important}}';
    d.head.appendChild(s);
    ['contextmenu','copy','cut','dragstart','selectstart'].forEach(function(e){d.addEventListener(e,function(ev){ev.preventDefault()})});
  }catch(e){}
}
function watermark(id){
  var t=id.slice(0,8);
  var svg="<svg xmlns='http://www.w3.org/2000/svg' width='230' height='150'><text x='115' y='80' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='15' fill='#7a8a9a' fill-opacity='0.16' transform='rotate(-25 115 75)'>CAP · "+t+"</text></svg>";
  wm.style.backgroundImage='url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
  wm.hidden=false;
}
function blur(on){app.style.filter=on?'blur(30px)':'none'}
document.addEventListener('visibilitychange',function(){blur(document.hidden)});
document.addEventListener('keyup',function(e){
  if(e.key==='PrintScreen'){blur(true);try{navigator.clipboard.writeText('')}catch(x){}setTimeout(function(){blur(false)},1500)}
});
document.addEventListener('contextmenu',function(e){e.preventDefault()});

function run(html,id){
  lock.hidden=true;app.hidden=false;
  app.addEventListener('load',function(){
    var d=app.contentDocument;harden(d);
    try{
      var f=d.getElementById('f');
      if(f){harden(f.contentDocument);f.addEventListener('load',function(){harden(f.contentDocument)})}
    }catch(e){}
  });
  app.srcdoc=html;
  watermark(id);
}

async function start(){
  var id=getId();elId.textContent=fmt(id);
  var act=null;try{act=localStorage.getItem(LS_ACT)}catch(e){}
  if(act){
    try{var html=await unlockWith(id,act,PAYLOAD);run(html,id);return}catch(e){}
  }
  lock.hidden=false;
}

elCopy.addEventListener('click',function(){
  var idv=elId.textContent;
  function done(){elCopy.textContent=t('copied');setTimeout(function(){elCopy.textContent=t('copy')},1800)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(idv).then(done,function(){})}
  else{var r=document.createRange();r.selectNodeContents(elId);var s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand('copy');done()}catch(e){}}
});

elGo.addEventListener('click',async function(){
  var raw=elCode.value.replace(/\s+/g,'');
  if(!raw){sayK('empty','err');return}
  elGo.disabled=true;sayK('check');
  var id=getId(),html=null,act=null;
  try{
    try{html=await unlockWith(id,raw,PAYLOAD);act=raw}catch(e){html=null}
    if(html===null){
      var r,j;
      try{
        r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:raw,deviceId:id})});
        j=await r.json();
      }catch(e){sayK('net','err');return}
      if(r.status===403&&j&&j.error==='limit'){sayK('limit','err');return}
      if(!r.ok||!j||!j.activation){sayK('bad','err');return}
      try{html=await unlockWith(id,j.activation,PAYLOAD);act=j.activation}catch(e){sayK('bad','err');return}
    }
    try{localStorage.setItem(LS_ACT,act)}catch(e){}
    sayK('okmsg','ok');
    run(html,id);
  }finally{elGo.disabled=false}
});

document.getElementById('l-fr').addEventListener('click',function(){applyLang('fr')});
document.getElementById('l-en').addEventListener('click',function(){applyLang('en')});
applyLang(lang);

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
start();
})();
